<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MC道具展台</title>
  <script src="libs/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-sky color="#87ceeb"></a-sky>
    <a-plane position="0 0 -3" rotation="-90 0 0" width="20" height="20" color="#5d9c3c"></a-plane>

    <a-box position="0 0.1 -3" width="5" height="0.8" depth="5" color="#8b5a2b"></a-box>
    <a-box position="0 0.55 -3" width="5" height="0.25" depth="5" color="#5d9c3c"></a-box>

    <a-box position="-1.8 1 -3" width="0.7" height="0.7" depth="0.7" color="#c0392b"
           animation="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
    </a-box>

    <a-entity position="1.8 1 -3" rotation="0 -30 0">
      <a-box position="0 0.4 0" width="0.16" height="1.0" depth="0.06" color="#4aedd9"></a-box>
      <a-box position="0 -0.1 0" width="0.4" height="0.08" depth="0.1" color="#3f3f3f"></a-box>
      <a-box position="0 -0.35 0" width="0.12" height="0.32" depth="0.12" color="#6b4a2a"></a-box>
    </a-entity>

    <a-entity position="0 1 0.5">
      <a-cylinder position="-2 0.5 -3.5" radius="0.06" height="0.7" color="#7a5230"></a-cylinder>
      <a-sphere position="-2 0.95 -3.5" radius="0.13" color="#ffb52e"
                animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 600; loop: true">
      </a-sphere>
      <a-light type="point" position="-2 1.0 -3.5" color="#ff9933" intensity="0.8"></a-light>
    </a-entity>

    <a-sphere position="2.2 0.8 -0.8" radius="0.32" color="#f2c14e"
              animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
    </a-sphere>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.5" position="4 8 5"></a-light>

    <a-camera position="0 2.5 5"></a-camera>
  </a-scene>
</body>
</html>
